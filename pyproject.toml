[project]
name = "remarkable-catalog"
version = "0.1.0"
description = "Django product catalog: categories, tags, search and filters, favourites, checkout and a JSON API."
readme = "README.md"
# Django 5.2 LTS supports Python 3.10-3.14 (3.14 from 5.2.8).
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.8,<5.3",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.2",
    "django-password-validators>=1.7.3",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
src = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "TID252"]  # classic defaults + no relative imports (use `catalog.…`)

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "vulture>=2.16",
]
