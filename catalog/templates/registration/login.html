{% extends "catalog/base.html" %}
{% block title %}Log in · Product Catalog{% endblock %}
{% block body %}
<div class="layout single">
  <main>
    <h1>Log in</h1>
    {% if form.errors %}<p class="errorlist">Your username and password didn't match. Please try again.</p>{% endif %}
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <p><label for="id_username">Username</label><br>{{ form.username }}</p>
      <p><label for="id_password">Password</label><br>{{ form.password }}</p>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Log in</button>
    </form>
  </main>
</div>
{% endblock %}
