{# Buy (everyone, when in stock). Needs `product` and `current_url`. The favourite control lives on the product page only. #}
{% if user.is_authenticated %}
  {% if product.items_available > 0 %}
    <form method="post" action="{% url 'catalog:buy' product.pk %}">{% csrf_token %}<input type="hidden" name="next" value="{{ current_url }}"><button type="submit" class="buy">Buy</button></form>
  {% endif %}
{% elif product.items_available > 0 %}
  <a class="button buy" href="{% url 'login' %}?next={{ current_url|urlencode }}">Buy</a>
{% endif %}
